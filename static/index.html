<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarMate</title>
<style>
  /* The palette is the team's presentation deck, read out of its slides:
     #0D0D15 ground, #FF2E88 accent, #EFEFF5 type. The logo mark is the same
     artwork, cropped to the monogram and cut out so it sits on the page
     background rather than on a black square of its own. */
  :root {
    --bg: #0d0d15; --panel: #171722; --raise: #1e1e2c; --line: #3a3a50;
    --ink: #efeff5; --muted: #8b8ba0; --dim: #728092;
    --pink: #ff2e88; --pink-soft: rgba(255, 46, 136, .13);
    --on-pink: #12030a;
    --err: #ff6b8a; --err-bg: #2a0f1a;
    --m-reason: rgba(255, 46, 136, .14); --m-reason-edge: #ff2e88;
    --m-know: rgba(177, 92, 255, .14); --m-know-edge: #b15cff;
    --m-reflect: rgba(255, 176, 32, .13); --m-reflect-edge: #ffb020;
    --m-revise: rgba(31, 157, 138, .15); --m-revise-edge: #1f9d8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* One pink bloom behind the masthead. Fixed, so scrolling the trace does not
     drag a gradient down the page with it. */
  body::before {
    content: ""; position: fixed; inset: -20vh 0 auto 0; height: 60vh;
    background: radial-gradient(60% 100% at 50% 0,
                rgba(255, 46, 136, .16), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1;
          max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }

  header { margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 46px; height: auto; display: block; }
  h1 {
    font-size: 27px; font-weight: 300; margin: 0; letter-spacing: .17em;
    text-transform: uppercase;
  }
  h1 b { font-weight: 300; color: var(--pink); }
  .tag { color: var(--muted); font-size: 14px; margin-top: 12px; max-width: 60ch; }
  .tag b { color: var(--pink); font-weight: 400; }
  .anchor {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
    padding: 5px 13px 5px 11px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px;
    font-size: 12.5px; color: var(--muted);
  }
  .anchor::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--pink); box-shadow: 0 0 7px var(--pink);
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 18px;
  }
  textarea {
    width: 100%; min-height: 88px; resize: vertical; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    color: var(--ink); font: inherit;
  }
  textarea::placeholder { color: var(--dim); }
  textarea:focus { outline: none; border-color: var(--pink);
                   box-shadow: 0 0 0 3px var(--pink-soft); }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: var(--pink); color: var(--on-pink); border: 0;
    padding: 10px 20px; border-radius: 10px; font: inherit; font-weight: 700;
    letter-spacing: .02em; cursor: pointer; transition: box-shadow .15s;
  }
  button:hover:not(:disabled) { box-shadow: 0 0 18px rgba(255, 46, 136, .45); }
  button:disabled { opacity: .4; cursor: default; }
  .ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    font-weight: 400;
  }
  .ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--pink);
                                box-shadow: none; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .examples button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    font-size: 13px; font-weight: 400; padding: 6px 12px; border-radius: 999px;
    text-align: left;
  }
  .examples button:hover { color: var(--ink); border-color: var(--pink);
                           background: var(--pink-soft); box-shadow: none; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .ask {
    background: var(--raise); border-left: 3px solid var(--pink);
    border-radius: 0 10px 10px 0; padding: 10px 14px; margin-bottom: 14px;
    white-space: pre-wrap;
  }
  .answer { white-space: pre-wrap; }
  .err { background: var(--err-bg); border-color: var(--err); color: var(--err); }
  .meta { color: var(--dim); font-size: 12.5px; margin-top: 14px; }

  details.trace > summary, details.step > summary { cursor: pointer; }
  details.trace {
    margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px;
  }
  details.trace > summary {
    font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600; margin-bottom: 10px;
  }
  details.trace > summary:hover { color: var(--pink); }
  details.step {
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
    background: var(--bg); overflow: hidden;
  }
  details.step > summary {
    padding: 10px 14px; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .badge {
    font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--raise); color: var(--ink);
  }
  .badge.Reasoner { background: var(--m-reason); border-color: var(--m-reason-edge); }
  .badge.KnowledgeRetriever { background: var(--m-know); border-color: var(--m-know-edge); }
  .badge.Reflector { background: var(--m-reflect); border-color: var(--m-reflect-edge); }
  .badge.Reviser { background: var(--m-revise); border-color: var(--m-revise-edge); }
  .n { color: var(--dim); font-weight: 400; font-size: 12.5px; }
  .tool { color: var(--muted); font-weight: 400; font-size: 12.5px;
          font-family: ui-monospace, Consolas, monospace; }
  .step-body { padding: 0 14px 14px; }
  .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  pre {
    background: #0a0a11; border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 13px; overflow-x: auto; margin: 0;
    font: 12.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; color: #d6d6e2;
  }
  .spin {
    width: 15px; height: 15px; border: 2px solid var(--line);
    border-top-color: var(--pink); border-radius: 50%;
    animation: r .7s linear infinite; display: inline-block; vertical-align: -3px;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  footer { color: var(--dim); font-size: 13px; margin-top: 28px; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--pink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/static/logo.png" alt="" width="46">
      <h1>Bar<b>Mate</b></h1>
    </div>
    <div class="tag">Your bar. <b>Under control.</b> An autonomous bar operations
      agent &mdash; ask about stock, losses, staffing or what to order.</div>
    <div class="anchor">Frozen at Sunday 2026-06-14, 18:00 &middot; one hour before doors</div>
  </header>

  <!-- Every turn of the conversation lands here: the question, the answer, and
       the trace of the LLM calls behind it. -->
  <div id="thread"></div>

  <div class="card" id="composer">
    <label for="prompt" class="lbl" style="margin-top:0">Your question</label>
    <textarea id="prompt" placeholder="How much Bombay Sapphire do we have and should I trust that number?"></textarea>
    <div class="row">
      <button id="run">Run Agent</button>
      <button id="reset" class="ghost" disabled>New conversation</button>
      <span id="status" class="tag"></span>
    </div>
    <div class="examples" id="examples"></div>
  </div>

  <footer>
    <a href="/api/team_info">team_info</a> &middot;
    <a href="/api/agent_info">agent_info</a> &middot;
    <a href="/api/model_architecture">model_architecture</a> &middot;
    <a href="/api/health">health</a>
  </footer>
</div>

<script>
// Ordered by how long they actually take, fastest first, because the first one
// clicked sets the impression and a hundred-second wait reads as a hang. Each
// exercises something different: staleness, the manual, the reorder
// arithmetic, a protocol that looks like theft, Hebrew, and the month view.
// "What should I order from the beer supplier before Tuesday?" used to sit
// here and was the worst of both -- the slowest chip, and at a three day
// horizon nothing in the catalogue needs ordering, so it answered "order
// nothing" after a hundred seconds.
const EXAMPLES = [
  "How much Bombay Sapphire do we have and should I trust that number?",
  "How many chasers can a shift manager comp before it needs approval?",
  "What kegs should I order for the week ahead?",
  "We're short on house white wine — is someone stealing it?",
  "מה קרה למלאי השבוע?",
  "Anything unusual in the numbers over the last month?",
  "What needs my attention before tonight's shift?"
];

const $ = id => document.getElementById(id);
const promptEl = $("prompt");

// The agent is stateless; the conversation lives here and travels with each
// request. That is what lets a manager answer the clarifying question it just
// asked -- "is 12.5 what was poured or what is left?" needs a reply.
let history = [];

EXAMPLES.forEach(text => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.onclick = () => { promptEl.value = text; promptEl.focus(); };
  $("examples").appendChild(b);
});

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function block(label, value) {
  const frag = document.createDocumentFragment();
  frag.appendChild(el("div", "lbl", label));
  const pre = el("pre");
  pre.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  frag.appendChild(pre);
  return frag;
}

function stepNode(s, i) {
  const d = el("details", "step");
  const sum = el("summary");
  sum.appendChild(el("span", "n", (i + 1) + "."));
  sum.appendChild(el("span", "badge " + (s.module || ""), s.module || "module"));
  // The tool the step chose, surfaced without opening it: reading which calls
  // were made in what order is most of what inspecting a trace is for.
  const action = s.response && s.response.action;
  if (action) sum.appendChild(el("span", "tool", action));
  d.appendChild(sum);

  const body = el("div", "step-body");
  const p = s.prompt || {};
  const sys = p.System_prompt ?? p.system_prompt;
  const usr = p.User_prompt ?? p.user_prompt;
  if (sys) body.appendChild(block("System prompt", sys));
  if (usr) body.appendChild(block("User prompt", usr));
  body.appendChild(block("Response", s.response));
  d.appendChild(body);
  return d;
}

function turnNode(prompt, data, seconds) {
  const card = el("div", "card");
  card.appendChild(el("div", "ask", prompt));

  if (data.status === "ok") {
    card.appendChild(el("div", "answer", data.response ?? ""));
  } else {
    const e = el("div", "answer");
    e.style.color = "var(--err)";
    e.textContent = data.error || "Unknown error.";
    card.appendChild(e);
  }

  const steps = Array.isArray(data.steps) ? data.steps : [];
  if (steps.length) {
    const trace = el("details", "trace");
    trace.appendChild(el("summary", null,
      steps.length + (steps.length === 1 ? " LLM call" : " LLM calls")
      + " — show the trace"));
    steps.forEach((s, i) => trace.appendChild(stepNode(s, i)));
    card.appendChild(trace);
  }

  card.appendChild(el("div", "meta", seconds + "s"));
  return card;
}

async function run() {
  const prompt = promptEl.value.trim();
  if (!prompt) {
    promptEl.focus();
    $("status").textContent = "Enter a question first.";
    return;
  }

  $("run").disabled = true;
  $("status").innerHTML = '<span class="spin"></span> thinking, this can take a minute';
  const started = Date.now();

  let data;
  try {
    const res = await fetch("/api/execute", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, history })
    });
    data = await res.json();
  } catch (e) {
    data = { status: "error", error: "Request failed: " + e.message, steps: [] };
  }

  const seconds = ((Date.now() - started) / 1000).toFixed(1);
  $("thread").appendChild(turnNode(prompt, data, seconds));

  if (data.status === "ok") {
    history.push({ prompt, answer: data.response ?? "" });
    promptEl.value = "";
  }
  $("reset").disabled = history.length === 0;
  $("run").disabled = false;
  $("status").textContent = "";
  $("composer").scrollIntoView({ behavior: "smooth", block: "end" });
}

$("run").onclick = run;
$("reset").onclick = () => {
  history = [];
  $("thread").textContent = "";
  promptEl.value = "";
  $("status").textContent = "";
  $("reset").disabled = true;
  promptEl.focus();
};
promptEl.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
});
</script>
</body>
</html>
